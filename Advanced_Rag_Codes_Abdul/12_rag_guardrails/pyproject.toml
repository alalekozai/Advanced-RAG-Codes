[project]
name = "rag-guardrails"
version = "0.1.0"
description = "Privacy and security guardrails for a RAG pipeline: PII redaction, prompt-injection defense, output filtering, audit logging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "langchain-openai>=1.2.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.10.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
